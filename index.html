<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>华为智慧屏 · 每日价格看板</title>
<script src="./echarts.min.js"></script>
<style>
  :root{
    --orange:#ff5000; --orange2:#ff7a45; --red:#e4393c; --green:#2db84d;
    --bg:#f5f5f7; --card:#fff; --border:#ececf0; --text:#1a1a1a; --sub:#888;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
  a{color:var(--orange);text-decoration:none}
  header{position:sticky;top:0;z-index:50;background:linear-gradient(135deg,var(--orange),var(--orange2));color:#fff;padding:12px 18px;box-shadow:0 2px 8px rgba(255,80,0,.3)}
  .head-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;max-width:1180px;margin:0 auto}
  header h1{font-size:18px;font-weight:700;white-space:nowrap}
  .store-tag{background:rgba(255,255,255,.22);border-radius:14px;padding:3px 12px;font-size:13px;white-space:nowrap}
  .status{flex:1;min-width:220px;font-size:12px;opacity:.95}
  .status b{font-weight:600}
  .actions{display:flex;gap:8px}
  .search{flex:1;min-width:180px;max-width:340px;display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.95);border-radius:20px;padding:5px 14px}
  .search input{flex:1;border:none;outline:none;font-size:14px;background:transparent;color:#333;padding:4px 0;min-width:0}
  .search button{border:none;background:var(--orange);color:#fff;border-radius:14px;padding:5px 14px;font-size:13px;cursor:pointer}
  .search button:hover{background:#e44500}
  .btn{border:none;background:rgba(255,255,255,.2);color:#fff;border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
  .btn:hover{background:rgba(255,255,255,.35)}
  .btn.on{background:var(--green)}
  .btn:disabled{opacity:.5;cursor:wait}
  .wrap{max-width:1180px;margin:0 auto;padding:14px 16px 80px}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
  .stat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 14px}
  .stat .k{font-size:12px;color:var(--sub)}
  .stat .v{font-size:20px;font-weight:700;margin-top:2px}
  .stat .v small{font-size:12px;font-weight:400;color:var(--sub)}
  .filters{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
  .filters .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .filters .label{font-size:12px;color:var(--sub);min-width:40px}
  .chip{padding:6px 13px;border-radius:16px;background:var(--card);border:1px solid var(--border);cursor:pointer;font-size:13px;transition:.15s;color:var(--sub)}
  .chip:hover{border-color:var(--orange2)}
  .chip.active{background:linear-gradient(135deg,var(--orange),var(--orange2));color:#fff;border-color:transparent}
  .panel{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:16px}
  .panel h2{font-size:15px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
  .panel h2 .hint{font-size:12px;color:var(--sub);font-weight:400}
  table{width:100%;border-collapse:collapse;font-size:13px}
  thead th{text-align:left;padding:8px 10px;border-bottom:2px solid var(--border);color:var(--sub);font-weight:500;font-size:12px;white-space:nowrap}
  tbody td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
  tbody tr{cursor:pointer}
  tbody tr:hover{background:#faf8f6}
  tbody tr.sel{background:#fff4ee}
  .model{font-weight:600;white-space:nowrap}
  .size{display:inline-block;background:rgba(255,80,0,.1);color:var(--orange);border-radius:6px;padding:1px 7px;font-size:11px;margin-left:6px;font-weight:500}
  .price{color:var(--red);font-weight:700;font-size:16px;white-space:nowrap}
  .price .yuan{font-size:12px}
  .up{color:var(--red);font-weight:600;font-size:12px;white-space:nowrap}
  .down{color:var(--green);font-weight:600;font-size:12px;white-space:nowrap}
  .flat{color:var(--sub);font-size:12px;white-space:nowrap}
  .cond{display:inline-block;background:#f0f0f0;border-radius:6px;padding:1px 7px;font-size:11px;color:#555;white-space:nowrap}
  .cond.new{background:#fff4ee;color:var(--orange)}
  .item-link{display:block;max-width:360px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#333}
  .item-link:hover{color:var(--orange)}
  .want{color:var(--sub);white-space:nowrap}
  .want b{color:var(--orange)}
  .chart{width:100%;height:420px}
  .empty{text-align:center;color:var(--sub);padding:40px;font-size:14px}
  @media(max-width:700px){
    .item-link{max-width:180px}
    .chart{height:320px}
  }
</style>
</head>
<body>
<header>
  <div class="head-row">
    <h1>📺 华为智慧屏 · 每日价格看板</h1>
    <span class="store-tag" id="storeTag">数据源：八号当铺</span>
    <div class="search">
      <input id="q" placeholder="搜索型号 / 尺寸 / 成色 / 关键词…" autocomplete="off">
      <button onclick="doSearch()">搜索</button>
    </div>
    <div class="status" id="status">加载中…</div>
    <div class="actions">
      <button class="btn" id="btnRefresh" onclick="manualRefresh()">🔄 立即采集</button>
      <button class="btn on" id="btnAuto" onclick="toggleAuto()">自动刷新:开</button>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="stats" id="stats"></div>

  <div class="filters">
    <div class="row">
      <span class="label">尺寸</span>
      <span class="chip active" data-size="all" onclick="pickSize('all',this)">全部</span>
    </div>
    <div class="row">
      <span class="label">系列</span>
      <span class="chip active" data-family="all" onclick="pickFamily('all',this)">全部</span>
    </div>
  </div>

  <div class="panel">
    <h2>📋 今日型号价格 <span class="hint">点击行可在下方趋势图中加入/移除该型号 · 价格=该型号今日最低在售价</span></h2>
    <div style="overflow-x:auto">
      <table>
        <thead>
          <tr>
            <th>型号</th><th>今日最低价</th><th>较昨日</th><th>均价</th>
            <th>在售</th><th>想要</th><th>成色</th><th>最低价商品</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div class="empty" id="tableEmpty" style="display:none">暂无数据，等待采集…</div>
  </div>

  <div class="panel">
    <h2>📈 每日价格趋势 <span class="hint" id="chartHint">显示所选型号的每日最低价走势</span></h2>
    <div class="chart" id="chart"></div>
  </div>
</div>

<script>
const API='/api';
const $=id=>document.getElementById(id);
let sizeFilter='all', familyFilter='all';
let searchQuery='';
let summary=null, historySeries={};
let selected=new Set();
let chart=null;

function esc(s){return String(s||'').replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]))}
function fmt(n){return (n||0).toLocaleString('zh-CN')}
function yuan(n){return '¥'+fmt(n)}

let STATIC_MODE=false;
// 优先读本地后端 /api，读不到（纯静态部署）则 fallback 到同目录 data.json
async function loadEndpoint(name){
  try{
    const r=await fetch(API+'/'+name,{cache:'no-store'});
    if(r.ok){ const j=await r.json(); if(j&&!j.static) return j; }
  }catch(e){}
  try{
    const r=await fetch('./data.json',{cache:'no-store'});
    if(r.ok){ const j=await r.json(); if(j&&j[name]!==undefined){ STATIC_MODE=true; return j[name]; } }
  }catch(e){}
  return null;
}
async function post(p){return (await fetch(API+p,{method:'POST',cache:'no-store'})).json()}

function changeHtml(row){
  if(row.change===null || row.change===undefined) return '<span class="flat">—</span>';
  if(row.change===0) return '<span class="flat">持平</span>';
  const pct=row.changePct!==null&&row.changePct!==undefined?` (${row.changePct>0?'+':''}${row.changePct}%)`:'';
  if(row.change>0) return `<span class="up">涨 +¥${fmt(row.change)}${pct}</span>`;
  return `<span class="down">跌 -¥${fmt(-row.change)}${pct}</span>`;
}

function renderFilters(summary){
  const sizes=[...new Set(summary.items.map(r=>r.size))].sort((a,b)=>b-a);
  const families=[...new Set(summary.items.map(r=>r.family))].sort();
  const sizeRow=document.querySelector('[data-size]').parentNode;
  const famRow=document.querySelector('[data-family]').parentNode;
  sizeRow.querySelectorAll('.chip:not([data-size="all"])').forEach(c=>c.remove());
  famRow.querySelectorAll('.chip:not([data-family="all"])').forEach(c=>c.remove());
  const allSize=sizeRow.querySelector('[data-size="all"]');
  sizes.forEach(s=>{
    const c=document.createElement('span');
    c.className='chip'+(sizeFilter===String(s)?' active':'');
    c.dataset.size=s; c.textContent=s+'英寸';
    c.onclick=()=>pickSize(String(s),c);
    allSize.insertAdjacentElement('afterend',c);
  });
  const allFam=famRow.querySelector('[data-family="all"]');
  families.forEach(f=>{
    const c=document.createElement('span');
    c.className='chip'+(familyFilter===f?' active':'');
    c.dataset.family=f; c.textContent=f;
    c.onclick=()=>pickFamily(f,c);
    allFam.insertAdjacentElement('afterend',c);
  });
}

function renderStats(summary){
  const s=summary.stats;
  if(!summary.items.length){ $('stats').innerHTML=''; return; }
  const cheap=s.cheapest?`${s.cheapest.model} ${s.cheapest.size}英寸`:'—';
  const hot=s.mostWant?`${s.mostWant.model} ${s.mostWant.size}英寸`:'—';
  $('stats').innerHTML=`
    <div class="stat"><div class="k">在售智慧屏</div><div class="v">${s.tvCount}<small> 件</small></div></div>
    <div class="stat"><div class="k">型号维度</div><div class="v">${s.modelCount}<small> 种</small></div></div>
    <div class="stat"><div class="k">全场最低</div><div class="v">${yuan(s.cheapest.minPrice)}<small> ${cheap}</small></div></div>
    <div class="stat"><div class="k">最热门(想要最多)</div><div class="v">${fmt(s.mostWant.wantTotal)}<small> ${hot}</small></div></div>`;
}

function renderTable(){
  const q=searchQuery.trim().toLowerCase();
  const items=summary.items.filter(r=>{
    if(sizeFilter!=='all'&&String(r.size)!==sizeFilter) return false;
    if(familyFilter!=='all'&&r.family!==familyFilter) return false;
    if(q){
      const it=r.minItem||{};
      const hay=(r.key+' '+r.model+' '+r.size+'英寸 '+r.family+' '+r.condition+' '+(it.title||'')).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
  if(!items.length){ $('tbody').innerHTML=''; $('tableEmpty').style.display='block'; $('tableEmpty').textContent='无匹配结果，换个关键词试试'; return; }
  $('tableEmpty').style.display='none';
  $('tbody').innerHTML=items.map(r=>{
    const it=r.minItem||{};
    const sel=selected.has(r.key)?' class="sel"':'';
    return `<tr${sel} data-key="${esc(r.key)}" onclick="toggleKey('${esc(r.key)}',this)">
      <td><span class="model">${esc(r.model)}</span><span class="size">${r.size}英寸</span></td>
      <td><span class="price"><span class="yuan">¥</span>${fmt(r.minPrice)}</span></td>
      <td>${changeHtml(r)}</td>
      <td style="color:var(--sub)">¥${fmt(r.avgPrice)}</td>
      <td style="color:var(--sub)">${r.count}</td>
      <td class="want"><b>${fmt(r.wantTotal)}</b></td>
      <td><span class="cond ${r.condition.indexOf('新')>=0||r.condition.indexOf('未')>=0?'new':''}">${esc(r.condition)}</span></td>
      <td><a class="item-link" href="https://www.goofish.com/item?id=${esc(it.itemId)}" target="_blank" title="${esc(it.title)}">${esc(it.title)}</a></td>
    </tr>`;
  }).join('');
}

function pickSize(v,el){ sizeFilter=v; document.querySelectorAll('[data-size]').forEach(c=>c.classList.toggle('active',c.dataset.size===v)); renderTable(); }
function pickFamily(v,el){ familyFilter=v; document.querySelectorAll('[data-family]').forEach(c=>c.classList.toggle('active',c.dataset.family===v)); renderTable(); }

function doSearch(){
  searchQuery=$('q').value.trim();
  renderTable();
}

function toggleKey(key,tr){
  if(selected.has(key)) selected.delete(key); else selected.add(key);
  tr.classList.toggle('sel',selected.has(key));
  renderChart();
}

function renderChart(){
  if(!chart) return;
  const dates=new Set();
  const keys=[...selected];
  const list=keys.filter(k=>historySeries[k]&&historySeries[k].length);
  list.forEach(k=>historySeries[k].forEach(p=>dates.add(p.date)));
  const xAxis=[...dates].sort();
  const series=list.map(k=>{
    const m=new Map(historySeries[k].map(p=>[p.date,p.minPrice]));
    return {
      name:k, type:'line', smooth:true, symbol:'circle', symbolSize:6,
      data:xAxis.map(d=>m.has(d)?m.get(d):null),
      lineStyle:{width:2}, connectNulls:false
    };
  });
  const modelNames=list.map(k=>k).join(' · ');
  $('chartHint').textContent=list.length?`显示 ${list.length} 个型号的每日最低价走势`:'点击上方表格行选择型号查看趋势';
  chart.setOption({
    tooltip:{trigger:'axis', valueFormatter:v=>'¥'+fmt(v)},
    legend:{type:'scroll', top:0},
    grid:{left:70,right:20,top:40,bottom:40},
    xAxis:{type:'category',data:xAxis,axisLabel:{fontSize:11}},
    yAxis:{type:'value',axisLabel:{formatter:v=>'¥'+(v/1000>=1?(v/1000)+'k':v)},splitLine:{lineStyle:{type:'dashed'}}},
    series:series,
    color:['#ff5000','#185FA5','#2db84d','#d4537e','#888780','#ba7517','#7f77dd','#1d9e75','#e24b4a','#378add']
  },true);
}

async function loadAll(){
  try{
    summary=await loadEndpoint('summary');
    if(summary.items && summary.items.length){
      $('storeTag').textContent='数据源：'+(summary.store||'八号当铺');
      renderFilters(summary);
      renderStats(summary);
      renderTable();
    } else {
      $('stats').innerHTML='';
      $('tbody').innerHTML='';
      $('tableEmpty').style.display='block';
      $('tableEmpty').textContent=summary.scrapedAt?('数据为空'):'暂无数据，等待首次采集…';
    }
  }catch(e){}
  try{
    const h=await loadEndpoint('history');
    historySeries=h.series||{};
    if(selected.size===0 && historySeries){
      // 默认选中想要数最高的前 6 个型号
      const keys=Object.keys(historySeries);
      const order=(summary&&summary.items)?summary.items.filter(r=>keys.includes(r.key)).sort((a,b)=>b.wantTotal-a.wantTotal).map(r=>r.key):keys;
      order.slice(0,6).forEach(k=>selected.add(k));
      document.querySelectorAll('#tbody tr').forEach(tr=>{
        tr.classList.toggle('sel',selected.has(tr.dataset.key));
      });
    }
    renderChart();
  }catch(e){}
}

function fmtTime(s){ if(!s) return '—'; return s.replace('T',' ').slice(5,16); }
async function loadStatus(){
  try{
    const st=await loadEndpoint('status');
    if(!st) return;
    if(st.static){
      STATIC_MODE=true;
      $('status').innerHTML='📡 云端静态快照 · 更新于 <b>'+fmtTime(st.scrapedAt)+'</b> · 本地开机自动同步';
      $('btnRefresh').style.display='none';
      $('btnAuto').style.display='none';
      return;
    }
    $('btnRefresh').style.display='';
    $('btnAuto').style.display='';
    const running=st.running?'🟠 采集中…':'🟢 空闲';
    const last=fmtTime(st.lastRun);
    const next=fmtTime(st.nextRun);
    $('status').innerHTML=`${running} · 上次采集 <b>${last}</b> · 下次 <b>${next}</b> · 间隔 ${st.refreshMinutes}分钟`+
      (st.error?` · <span style="color:#ffd">⚠ ${esc(st.error)}</span>`:'')+
      (st.lastMsg?` · ${esc(st.lastMsg.slice(0,40))}`:'');
    $('btnAuto').textContent='自动刷新:'+(st.autoRefresh?'开':'关');
    $('btnAuto').classList.toggle('on',st.autoRefresh);
    $('btnRefresh').disabled=st.running;
  }catch(e){}
}

async function manualRefresh(){
  $('btnRefresh').disabled=true; $('btnRefresh').textContent='采集中…';
  await post('/refresh');
  setTimeout(()=>{loadStatus();loadAll();},3000);
}
async function toggleAuto(){
  const r=await post('/toggleAuto');
  $('btnAuto').textContent='自动刷新:'+(r.autoRefresh?'开':'关');
  $('btnAuto').classList.toggle('on',r.autoRefresh);
}

window.addEventListener('load',async()=>{
  chart=echarts.init($('chart'));
  window.addEventListener('resize',()=>chart.resize());
  // 搜索框：实时过滤 + 回车搜索
  $('q').addEventListener('input',()=>{ searchQuery=$('q').value.trim(); renderTable(); });
  $('q').addEventListener('keydown',e=>{ if(e.key==='Enter') doSearch(); });
  await loadAll();
  await loadStatus();
  setInterval(loadAll,30000);   // 每 30 秒刷新价格
  setInterval(loadStatus,10000); // 每 10 秒刷新采集状态
});
</script>
</body>
</html>
